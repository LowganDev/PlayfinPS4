# Jellyfin test server with Live TV channels (see README). Started by up.sh, which sets DATA, UID and GID.
name: playfin-testserver
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.8
    user: "${UID}:${GID}"
    ports:
      - "8097:8096"
    volumes:
      - ${DATA}/config:/config
      - ${DATA}/cache:/cache
      - ${DATA}/media:/media:ro
      - ${DATA}/recordings:/recordings
    restart: "no"
  # the live channels' HLS streams, reached as http://$STREAMS/chN/index.m3u8: "streams" inside Docker by default,
  # or <this PC>:8098 (STREAMS=192.168.1.x:8098 up.sh) so that the console plays them directly; also the console's
  # own XMLTV guide (/console-guide.xml)
  streams:
    image: nginx:1.27-alpine
    ports:
      - "8098:80"
    volumes:
      - ${DATA}/hls:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: "no"
